<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digitale Medienpädagogin</title>
<link rel="stylesheet" href="./style.css">
<script type="module" src="./app.js"></script>
</head>
<body>
<main>
<header>
<p class="category">Hilfe bei Fragen rund ums Netz</p>
<h1>Digitale Medienpädagogin</h1>
</header>
<form id="question-form">
<label for="question">Was möchtest du wissen?</label>
<textarea id="question" name="question" rows="5" minlength="5" maxlength="1600" required
placeholder="Was kann ich tun, wenn jemand im Klassenchat fertiggemacht wird?"></textarea>
<p class="hint">Beschreibe die Situation ohne Namen, Nutzernamen oder Kontaktdaten. Deine Frage wird an den KI Dienst übermittelt.</p>
<button type="submit">Antwort finden</button>
</form>
<p id="status" role="status" aria-live="polite"></p>
<section id="result" aria-labelledby="answer-title" hidden>
<h2 id="answer-title" tabindex="-1">Antwort</h2>
<div id="answer"></div>
</section>
<footer>
<p>Die Antworten stützen sich auf diese Ratgeber.</p>
<ul>
<li><a href="https://www.juuuport.de/infos/ratgeber">JUUUPORT</a></li>
<li><a href="https://www.klicksafe.de/themen">klicksafe</a></li>
<li><a href="https://hateaid.org/betroffenenberatung/">HateAid</a></li>
</ul>
</footer>
</main>
</body>
</html>
